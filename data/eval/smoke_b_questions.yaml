version: 1
questions:
  - id: q08
    category: citation_check
    query: WHCNS 模型在华北平原四个站点上模拟作物产量的精度如何？
    expected_points:
      - 四站点产量决定系数 R² 介于 0.84–0.99
      - RMSE 介于 243–1097 kg/ha
      - IA（一致性指数）全部大于 0.70
      - DBW 站点 2011 年冬小麦产量异常低（约 3220 kg/ha）属极端气候，模型未模拟病虫害/极端气候影响
    should_refuse: false
    notes: 预期命中 [26] Liang 2016。boost 证据段 026::0172（R²/RMSE/IA），需 numeric_boost 默认开才进 top_n。
